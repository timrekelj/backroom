[package]
name = "thehideout-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "thehideout-desktop"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gethostname = "1"
image = { version = "0.25.10", default-features = false, features = ["gif", "webp", "png", "jpeg"] }
rune = { workspace = true, features = ["tooling", "native-file-dialog"] }
rune-kit = { workspace = true }
serde = { version = "1", features = ["derive"] }
thehideout-api = { workspace = true }
thehideout-design = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util"] }

[dev-dependencies]
serde_json = "1"
axum = "0.8"
rand = "0.9"
totp-rs = { version = "5", features = ["otpauth"] }
scylla = { version = "1", features = ["chrono-04"] }
thehideout-server = { path = "../../server" }
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
