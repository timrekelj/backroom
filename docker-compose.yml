services:
  scylla:
    image: scylladb/scylla:2025.4
    container_name: backroom-scylla
    command: --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1 --broadcast-rpc-address 127.0.0.1
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  scylla-data:
