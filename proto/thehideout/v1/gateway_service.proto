syntax = "proto3";

package thehideout.v1;

import "thehideout/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Real-time event delivery over a server-streaming RPC.
service GatewayService {
  // Opens a long-lived stream of events for every guild the caller belongs
  // to and every DM channel the caller participates in. The server sends
  // periodic heartbeat events so clients can detect a dead stream and
  // reconnect.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

// Request to open an event stream.
message SubscribeRequest {}

// One item on the event stream.
message SubscribeResponse {
  // The event being delivered.
  Event event = 1;
}

// A real-time event.
message Event {
  // Monotonically increasing sequence number of the event within the stream.
  uint64 sequence = 1;
  // The event payload.
  oneof payload {
    // A message was posted in a channel.
    Message message_created = 2;
    // A channel was created in a guild.
    Channel channel_created = 3;
    // A user joined a guild.
    GuildMemberJoined guild_member_joined = 4;
    // Keep-alive signal.
    Heartbeat heartbeat = 5;
    // A DM channel was opened with the caller.
    DmChannel dm_opened = 6;
    // A guild's name or icon changed. Audience: guild members.
    Guild guild_updated = 7;
    // A channel's name, icon, colour or topic changed. Audience: guild members.
    Channel channel_updated = 8;
    // A guild's layout changed (sections and/or channel order). Audience:
    // guild members.
    LayoutUpdated layout_updated = 9;
    // A guild's roles changed (create, update, delete, reorder). Audience:
    // guild members.
    RolesUpdated roles_updated = 10;
    // A member's roles changed. Audience: guild members.
    MemberUpdated member_updated = 11;
    // A user changed their profile (e.g. avatar). Audience: every user that
    // shares at least one guild or DM channel with that user (and the user
    // themself). Not scoped to a guild.
    User user_updated = 12;
    // A guild's custom emojis changed (full list). Audience: guild members.
    EmojisUpdated emojis_updated = 13;
    // A user reacted to a message. Audience: channel audience.
    ReactionChange reaction_added = 14;
    // A user removed a reaction. Audience: channel audience.
    ReactionChange reaction_removed = 15;
    // A message changed (embeds resolved, attachment removed, ...); carries
    // the full message. Audience: channel audience.
    MessageUpdated message_updated = 16;
  }
}

// Payload of a layout change.
message LayoutUpdated {
  // ID of the guild.
  uint64 guild_id = 1;
  // The full new layout.
  GuildLayout layout = 2;
}

// Payload of a roles change; always the full list, so clients replace theirs.
message RolesUpdated {
  // ID of the guild.
  uint64 guild_id = 1;
  // All roles of the guild.
  repeated Role roles = 2;
  // Current roles version (see ListRolesResponse.version).
  uint64 version = 3;
}

// Payload of an emoji list change; always the full list.
message EmojisUpdated {
  // ID of the guild.
  uint64 guild_id = 1;
  // All custom emojis of the guild.
  repeated Emoji emojis = 2;
}

// Payload of a reaction being added or removed.
message ReactionChange {
  // Channel of the message.
  uint64 channel_id = 1;
  // The message.
  uint64 message_id = 2;
  // The emoji.
  ReactionEmoji emoji = 3;
  // The user who reacted / un-reacted.
  uint64 user_id = 4;
}

// Payload of a message change.
message MessageUpdated {
  // The full, current message (replace the local copy).
  Message message = 1;
}

// Payload of a member change.
message MemberUpdated {
  // ID of the guild.
  uint64 guild_id = 1;
  // The member's new state.
  Member member = 2;
}

// Payload of a user joining a guild.
message GuildMemberJoined {
  // ID of the guild that was joined.
  uint64 guild_id = 1;
  // The user who joined.
  User user = 2;
}

// Keep-alive payload sent periodically by the server.
message Heartbeat {
  // Current server time.
  google.protobuf.Timestamp server_time = 1;
}
