[package]
name = "backroom-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "backroom_server"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "backroom-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
chrono = "0.4"
connectrpc = { version = "0.9", features = ["axum"] }
futures = "0.3"
scylla = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
connectrpc-build = "0.9"

[dev-dependencies]
connectrpc = { version = "0.9", features = ["axum", "client"] }
rand = "0.9"
